[project]
name = "bmis-desktop"
version = "0.1.0"
description = "Python backend for BMis Desktop"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "pyright"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["bmis_desktop", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"